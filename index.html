<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>THICC Screener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; margin: 0; }
    .pos { color: #4ade80; }
    .neg { color: #f87171; }
    .muted { color: #737373; }
    table {
      table-layout: fixed;
      width: 100%;
      min-width: 1000px;
      font-variant-numeric: tabular-nums;
    }
    table.hide-7d { min-width: 900px; }
    table.hide-30d { min-width: 900px; }
    table.hide-7d.hide-30d { min-width: 800px; }
    table.hide-7d .col-7d,
    table.hide-30d .col-30d { display: none !important; }
    th, td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0.5rem 0.45rem;
      vertical-align: middle;
      text-align: left;
    }
    td.chg, th.chg { white-space: normal; }
    .chg-stack, .amt-stack {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      line-height: 1.25;
    }
    .chg-stack { font-size: 0.72rem; }
    .amt-stack { font-size: 0.8rem; }
    .amt-usd { font-size: 0.68rem; color: #737373; }
    .token-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .token-logo, .token-logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #262626;
      object-fit: cover;
    }
    .token-logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .copy-btn { opacity: 0.45; cursor: pointer; flex-shrink: 0; }
    .copy-btn:hover, .copy-btn:active { opacity: 1; }
    #search {
      background: #171717;
      border: 1px solid #333;
      color: #e5e5e5;
      border-radius: 9999px;
      padding: 0.5rem 0.9rem 0.5rem 2.1rem;
      font-size: 0.875rem;
      width: 100%;
      max-width: 280px;
      outline: none;
    }
    #search:focus { border-color: #34d399; }
    .search-wrap { position: relative; width: 100%; max-width: 280px; }
    .search-wrap svg {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: #737373;
      pointer-events: none;
    }
    .topnav {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex-wrap: wrap;
      padding: 0.55rem 0.75rem;
      background: #0d0d0d;
      border-bottom: 1px solid #1f1f1f;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topnav a {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      color: #d4d4d4;
      text-decoration: none;
      white-space: nowrap;
    }
    .topnav a:hover, .topnav a:active { background: #1a1a1a; color: #fff; }
    .topnav .brand {
      font-weight: 700;
      color: #34d399;
      font-size: 0.9rem;
      margin-right: 0.25rem;
    }
    .topnav .brand:hover { color: #6ee7b7; background: transparent; }
    .page-btn {
      background: #171717;
      border: 1px solid #333;
      color: #e5e5e5;
      border-radius: 0.5rem;
      padding: 0.5rem 1.1rem;
      font-size: 0.875rem;
      cursor: pointer;
      min-height: 44px;
    }
    .page-btn:hover:not(:disabled) { border-color: #34d399; color: #34d399; }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }
    @media (min-width: 900px) {
      .stats {
        grid-template-columns: 1.35fr 1fr 1fr 1fr;
        gap: 0.6rem;
      }
    }
    .stat-card {
      background: linear-gradient(165deg, #161a18 0%, #101210 55%, #0c0e0d 100%);
      border: 1px solid #2a3330;
      border-radius: 0.65rem;
      padding: 0.65rem 0.75rem;
      box-shadow: 0 1px 0 rgba(52, 211, 153, 0.06) inset, 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #8a9a92;
      letter-spacing: 0.02em;
      margin-bottom: 0.35rem;
    }
    .stat-value, .overview-row .v, .stat-grid .v {
      font-size: 0.9rem;
      font-weight: 600;
      color: #eef2f0;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.accent, .overview-row .v.accent { color: #34d399; }
    .stat-sub { font-size: 0.75rem; margin-top: 0.2rem; }
    .overview-row .k, .stat-grid .k { font-size: 0.75rem; color: #6b7a72; }
    .stat-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.2rem 0.6rem;
      align-items: baseline;
    }
    .stat-grid .v { text-align: right; }
    .overview-rows { display: flex; flex-direction: column; gap: 0.35rem; }
    .overview-row { display: flex; justify-content: space-between; gap: 0.5rem; }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="./">
      <img src="logo.png" alt="THICC" width="28" height="28" style="border-radius:6px" />
      ThiccScreener
    </a>
    <a href="https://pools.trade/t/0xE72936b1fE4cc0a521aE82bb9239F28f3FdB1C5D" target="_blank" rel="noopener">Buy THICC</a>
    <a href="https://dexscreener.com/robinhood/0xE72936b1fE4cc0a521aE82bb9239F28f3FdB1C5D" target="_blank" rel="noopener">Chart</a>
    <a href="https://t.me/THICCcommunity" target="_blank" rel="noopener">Join TG</a>
  </nav>

  <div class="max-w-[1400px] mx-auto px-3 py-4 sm:p-4 md:p-6">
    <div class="flex flex-col sm:flex-row sm:flex-wrap sm:items-end sm:justify-between gap-3 mb-3">
      <p class="text-sm text-neutral-400 leading-snug">
        Top tokens on
        <a href="https://pools.trade/" target="_blank" rel="noopener" class="text-emerald-400 hover:underline">Pools</a>
        by LP value
      </p>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input id="search" type="search" placeholder="Search token / CA" autocomplete="off" />
      </div>
    </div>

    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-label">Overview</div>
        <div class="overview-rows">
          <div class="overview-row">
            <span class="k">Total LP</span>
            <span class="v accent" id="stat-lp">—</span>
          </div>
          <div class="overview-row">
            <span class="k">24h Volume</span>
            <span class="v" id="stat-vol">—</span>
          </div>
          <div class="overview-row">
            <span class="k">Pools Tracked</span>
            <span class="v" id="stat-pools">—</span>
          </div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total ETH in Pools</div>
        <div class="stat-value" id="stat-eth">—</div>
        <div class="stat-sub" id="stat-eth-chg"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Instant launches</div>
        <div class="stat-grid" id="stat-instant">
          <span class="k">24h</span><span class="v">—</span>
          <span class="k">7d</span><span class="v">—</span>
          <span class="k">30d</span><span class="v">—</span>
          <span class="k">All</span><span class="v">—</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Crowd launches</div>
        <div class="stat-grid" id="stat-crowd">
          <span class="k">24h</span><span class="v">—</span>
          <span class="k">7d</span><span class="v">—</span>
          <span class="k">30d</span><span class="v">—</span>
          <span class="k">All</span><span class="v">—</span>
        </div>
      </div>
    </div>

    <div class="desktop-table overflow-x-auto rounded-lg border border-neutral-800">
      <table class="text-sm" id="token-table">
        <colgroup>
          <col style="width:3%" />
          <col style="width:15%" />
          <col style="width:10%" />
          <col style="width:9%" />
          <col style="width:10%" />
          <col style="width:10%" />
          <col class="col-7d" style="width:10%" />
          <col class="col-30d" style="width:10%" />
          <col style="width:9%" />
          <col style="width:9%" />
          <col style="width:9%" />
          <col style="width:5%" />
        </colgroup>
        <thead class="bg-neutral-900 text-neutral-400 text-xs uppercase">
          <tr>
            <th>#</th>
            <th>Token</th>
            <th>LP Value</th>
            <th>ETH</th>
            <th>Token</th>
            <th class="chg">24h</th>
            <th class="chg col-7d">7d</th>
            <th class="chg col-30d">30d</th>
            <th>Fdv</th>
            <th>Volume</th>
            <th>Price</th>
            <th>Trade</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="flex items-center justify-between gap-3 mt-4 flex-wrap">
      <span id="page-info" class="text-sm text-neutral-400"></span>
      <div class="flex gap-2">
        <button class="page-btn" id="prev-btn" disabled>Prev</button>
        <button class="page-btn" id="next-btn" disabled>Next</button>
      </div>
    </div>
  </div>

  <script>
    const PER_PAGE = 20;
    const COPY_ICON = `<svg class="copy-btn inline w-3.5 h-3.5 ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
    const CHECK_ICON = `<svg class="inline w-3.5 h-3.5 ml-1 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>`;

    let allTokens = [];
    let filtered = [];
    let page = 0;
    let has7d = false;
    let has30d = false;

    const $ = (id) => document.getElementById(id);

    function fmtUsd(n) {
      if (n == null || !Number.isFinite(n)) return '—';
      if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
      if (Math.abs(n) >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'k';
      return '$' + n.toFixed(2);
    }
    function fmtNum(n, d = 2) {
      if (n == null || !Number.isFinite(n)) return '—';
      if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1) + 'k';
      return n.toFixed(d);
    }
    function fmtPct(n) {
      if (n == null || !Number.isFinite(n)) return '<span class="muted">—</span>';
      const cls = n > 0 ? 'pos' : n < 0 ? 'neg' : 'muted';
      const sign = n > 0 ? '+' : '';
      return `<span class="${cls}">${sign}${n.toFixed(2)}%</span>`;
    }
    function fmtChg(pctEth, pctTok) {
      return `<div class="chg-stack">
        <div>ETH ${fmtPct(pctEth)}</div>
        <div>Tok ${fmtPct(pctTok)}</div>
      </div>`;
    }
    function fmtAmt(side, usd) {
      return `<div class="amt-stack">
        <div>${fmtNum(side, 4)}</div>
        <div class="amt-usd">${fmtUsd(usd)}</div>
      </div>`;
    }

    function copyCA(addr, el) {
      navigator.clipboard.writeText(addr).then(() => {
        const prev = el.innerHTML;
        el.innerHTML = CHECK_ICON;
        setTimeout(() => { el.innerHTML = prev; }, 1200);
      });
    }
    window.copyCA = copyCA;

    function renderStats(s) {
      $('stat-lp').textContent = fmtUsd(s.total_lp_usd);
      $('stat-vol').textContent = fmtUsd(s.total_volume_24h);
      $('stat-pools').textContent = s.pools ?? '—';
      $('stat-eth').textContent = fmtNum(s.total_eth_side, 2) + ' ETH';
      const chg = s.total_eth_change_24h_pct;
      $('stat-eth-chg').innerHTML = Number.isFinite(chg)
        ? `<span class="${chg >= 0 ? 'pos' : 'neg'}">${chg > 0 ? '+' : ''}${chg.toFixed(2)}% 24h</span>`
        : '';
      const setGrid = (id, obj) => {
        const el = $(id);
        if (!obj) return;
        el.innerHTML = `
          <span class="k">24h</span><span class="v">${obj.h24 ?? '—'}</span>
          <span class="k">7d</span><span class="v">${obj.d7 ?? '—'}</span>
          <span class="k">30d</span><span class="v">${obj.d30 ?? '—'}</span>
          <span class="k">All</span><span class="v">${obj.all ?? '—'}</span>`;
      };
      setGrid('stat-instant', s.instant_launches);
      setGrid('stat-crowd', s.crowd_launches);
    }

    function renderTable() {
      const start = page * PER_PAGE;
      const slice = filtered.slice(start, start + PER_PAGE);
      const tbody = $('tbody');
      tbody.innerHTML = slice.map((t, i) => {
        const rank = start + i + 1;
        const logo = t.image
          ? `<img class="token-logo" src="${t.image}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
             <div class="token-logo-fallback" style="display:none">${t.emoji || (t.symbol || '?')[0]}</div>`
          : `<div class="token-logo-fallback">${t.emoji || (t.symbol || '?')[0]}</div>`;
        const ca = (t.token || '').replace(/'/g, "\\'");
        return `<tr class="border-t border-neutral-800 hover:bg-neutral-900/50">
          <td class="muted">${rank}</td>
          <td>
            <div class="token-cell">
              ${logo}
              <div style="min-width:0">
                <div class="font-medium truncate inline-flex items-center max-w-full">
                  <span class="truncate">${t.symbol || '—'}</span>
                  <span onclick="copyCA('${ca}', this)" title="Copy CA">${COPY_ICON}</span>
                </div>
                <div class="text-xs muted truncate">${t.name || ''}</div>
              </div>
            </div>
          </td>
          <td>${fmtUsd(t.lp_value)}</td>
          <td>${fmtAmt(t.eth_side, t.eth_side_usd)}</td>
          <td>${fmtAmt(t.token_side, t.token_side_usd)}</td>
          <td class="chg">${fmtChg(t.eth_change_24h_pct, t.token_change_24h_pct)}</td>
          <td class="chg col-7d">${fmtChg(t.eth_change_7d_pct, t.token_change_7d_pct)}</td>
          <td class="chg col-30d">${fmtChg(t.eth_change_30d_pct, t.token_change_30d_pct)}</td>
          <td>${fmtUsd(t.fdv)}</td>
          <td>${fmtUsd(t.volume_24h)}</td>
          <td>${t.price != null && Number.isFinite(t.price) ? '$' + Number(t.price).toPrecision(4) : '—'}</td>
          <td><a href="https://pools.trade/t/${t.token}" target="_blank" rel="noopener" class="text-emerald-400 hover:underline text-xs">Trade</a></td>
        </tr>`;
      }).join('');

      const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
      $('page-info').textContent = filtered.length
        ? `Page ${page + 1} of ${totalPages} · ${filtered.length} tokens`
        : 'No tokens';
      $('prev-btn').disabled = page <= 0;
      $('next-btn').disabled = page >= totalPages - 1;
    }

    function applyFilter() {
      const q = ($('search').value || '').trim().toLowerCase();
      filtered = !q
        ? allTokens.slice()
        : allTokens.filter(t =>
            (t.symbol || '').toLowerCase().includes(q) ||
            (t.name || '').toLowerCase().includes(q) ||
            (t.token || '').toLowerCase().includes(q)
          );
      page = 0;
      renderTable();
    }

    $('search').addEventListener('input', applyFilter);
    $('prev-btn').onclick = () => { if (page > 0) { page--; renderTable(); } };
    $('next-btn').onclick = () => {
      if ((page + 1) * PER_PAGE < filtered.length) { page++; renderTable(); }
    };

    fetch('data.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        allTokens = (data.tokens || []).slice().sort((a, b) => (b.lp_value || 0) - (a.lp_value || 0));
        has7d = allTokens.some(t => Number.isFinite(t.eth_change_7d_pct) || Number.isFinite(t.token_change_7d_pct));
        has30d = allTokens.some(t => Number.isFinite(t.eth_change_30d_pct) || Number.isFinite(t.token_change_30d_pct));
        const table = $('token-table');
        table.classList.toggle('hide-7d', !has7d);
        table.classList.toggle('hide-30d', !has30d);
        renderStats(data.stats || {});
        applyFilter();
      })
      .catch(err => {
        console.error(err);
        $('tbody').innerHTML = '<tr><td colspan="12" class="text-center py-8 muted">Failed to load data.json</td></tr>';
      });
  </script>
</body>
</html>
