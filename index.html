<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>THICC Screener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; margin: 0; }
    .pos { color: #4ade80; }
    .neg { color: #f87171; }
    .muted { color: #737373; }
    table {
      table-layout: fixed;
      width: 100%;
      min-width: 1000px;
      font-variant-numeric: tabular-nums;
    }
    table.hide-7d { min-width: 900px; }
    table.hide-30d { min-width: 900px; }
    table.hide-7d.hide-30d { min-width: 800px; }
    th, td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0.5rem 0.45rem;
      vertical-align: middle;
      text-align: left;
    }
    td.chg, th.chg { white-space: normal; }
    .chg-stack, .amt-stack {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      line-height: 1.25;
    }
    .chg-stack { font-size: 0.72rem; }
    .amt-stack { font-size: 0.8rem; }
    .amt-usd { font-size: 0.68rem; color: #737373; }
    .token-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .token-logo, .token-logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #262626;
      object-fit: cover;
    }
    .token-logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .copy-btn { opacity: 0.45; cursor: pointer; flex-shrink: 0; }
    .copy-btn:hover, .copy-btn:active { opacity: 1; }
    #search {
      background: #171717;
      border: 1px solid #333;
      color: #e5e5e5;
      border-radius: 9999px;
      padding: 0.5rem 0.9rem 0.5rem 2.1rem;
      font-size: 0.875rem;
      width: 100%;
      max-width: 280px;
      outline: none;
    }
    #search:focus { border-color: #34d399; }
    .search-wrap { position: relative; width: 100%; max-width: 280px; }
    .search-wrap svg {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: #737373;
      pointer-events: none;
    }
    .topnav {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex-wrap: wrap;
      padding: 0.55rem 0.75rem;
      background: #0d0d0d;
      border-bottom: 1px solid #1f1f1f;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topnav a {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      color: #d4d4d4;
      text-decoration: none;
      white-space: nowrap;
    }
    .topnav a:hover, .topnav a:active { background: #1a1a1a; color: #fff; }
    .topnav .brand {
      font-weight: 700;
      color: #34d399;
      font-size: 0.9rem;
      margin-right: 0.25rem;
    }
    .topnav .brand:hover { color: #6ee7b7; background: transparent; }
    .page-btn {
      background: #171717;
      border: 1px solid #333;
      color: #e5e5e5;
      border-radius: 0.5rem;
      padding: 0.5rem 1.1rem;
      font-size: 0.875rem;
      cursor: pointer;
      min-height: 44px;
    }
    .page-btn:hover:not(:disabled) { border-color: #34d399; color: #34d399; }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }
    @media (min-width: 900px) {
      .stats {
        grid-template-columns: 1.35fr 1fr 1fr 1fr;
        gap: 0.6rem;
      }
    }
    .stat-card {
      background: linear-gradient(165deg, #161a18 0%, #101210 55%, #0c0e0d 100%);
      border: 1px solid #2a3330;
      border-radius: 0.65rem;
      padding: 0.65rem 0.75rem;
      box-shadow: 0 1px 0 rgba(52, 211, 153, 0.06) inset, 0 4px 16px rgba(0, 0, 0, 0.35);
      min-height: 0;
    }
    .stat-card:hover {
      border-color: #3d4a44;
      box-shadow: 0 1px 0 rgba(52, 211, 153, 0.1) inset, 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #8a9a92;
      letter-spacing: 0.02em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.35rem;
    }
    .stat-value,
    .overview-row .v,
    .stat-grid .v {
      font-size: 0.9rem;
      font-weight: 600;
      color: #eef2f0;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }
    .stat-value { margin-top: 0; }
    .stat-value.accent,
    .overview-row .v.accent { color: #34d399; }
    .stat-sub {
      font-size: 0.75rem;
      margin-top: 0.2rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
    }
    .overview-row .k,
    .stat-grid .k {
      font-size: 0.75rem;
      color: #6b7a72;
      line-height: 1.3;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.2rem 0.6rem;
      margin-top: 0;
      align-items: baseline;
    }
    .stat-grid .v { text-align: right; }
    .overview-rows {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 0;
    }
    .overview-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      font-variant-numeric: tabular-nums;
    }

    .mobile-list { display: none; }
    .m-card {
      border: 1px solid #262626;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      background: #111;
    }
    .m-card + .m-card { margin-top: 0.6rem; }
    .m-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
    }
    .m-row + .m-row { margin-top: 0.35rem; }
    .m-label { color: #737373; }
    .m-trade {
      display: inline-block;
      margin-top: 0.65rem;
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      background: #064e3b;
      color: #6ee7b7;
      font-size: 0.8rem;
      text-decoration: none;
      font-weight: 600;
    }

    table.hide-7d .col-7d,
    table.hide-30d .col-30d { display: none !important; }

    @media (max-width: 767px) {
      .desktop-table { display: none !important; }
      .mobile-list { display: block; }
      #search, .search-wrap { max-width: none; }
      .topnav a { font-size: 0.75rem; padding: 0.35rem 0.5rem; }
      .token-logo, .token-logo-fallback { width: 32px; height: 32px; }
      .stat-card { padding: 0.55rem 0.6rem; }
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="./">
      <img src="logo.png" alt="THICC" width="28" height="28" style="border-radius:6px" />
      ThiccScreener
    </a>
    <a href="https://pools.trade/t/0xE72936b1fE4cc0a521aE82bb9239F28f3FdB1C5D" target="_blank" rel="noopener">Buy THICC</a>
    <a href="https://dexscreener.com/robinhood/0xE72936b1fE4cc0a521aE82bb9239F28f3FdB1C5D" target="_blank" rel="noopener">Chart</a>
    <a href="https://t.me/THICCcommunity" target="_blank" rel="noopener">Join TG</a>

          <span class="k">24h</span><span class="v">—</span>

          <span class="k">30d</span><span class="v">—</span>
          <span class="k">All</span><span class="v">—</span>

    <div class="desktop-table overflow-x-auto rounded-lg border border-neutral-800 -mx-0">

          <col class="col-7d" style="width:10%" />

          <col style="width:9%" />
          <col style="width:9%" />
          <col style="width:9%" />
          <col style="width:5%" />
        </colgroup>
