<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THICC Screener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; }
    .pos { color: #4ade80; }
    .neg { color: #f87171; }
    table {
      table-layout: fixed;
      width: 100%;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0.5rem 0.4rem;
      vertical-align: middle;
    }
    .token-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .token-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #262626;
    }
    .token-logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #262626;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .copy-btn { opacity: 0.45; cursor: pointer; vertical-align: middle; flex-shrink: 0; }
    .copy-btn:hover { opacity: 1; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-6">
  <div class="max-w-[1400px] mx-auto">
    <h1 class="text-2xl font-bold text-emerald-400 mb-1">THICC Screener</h1>
    <p class="text-sm text-neutral-400 mb-4">
      pools.trade · ranked by LP Value ·
      <span id="updated">loading…</span>
    </p>

    <div class="overflow-x-auto rounded-lg border border-neutral-800">
      <table class="text-sm text-left">
        <colgroup>
          <col style="width:4%" />
          <col style="width:18%" />
          <col style="width:10%" />
          <col style="width:11%" />
          <col style="width:11%" />
          <col style="width:11%" />
          <col style="width:10%" />
          <col style="width:10%" />
          <col style="width:10%" />
          <col style="width:5%" />
        </colgroup>
        <thead class="bg-neutral-900 text-neutral-400 uppercase text-xs">
          <tr>
            <th>#</th>
            <th>Token</th>
            <th class="text-right">LP Value</th>
            <th class="text-right">24h</th>
            <th class="text-right">7d</th>
            <th class="text-right">30d</th>
            <th class="text-right">FDV</th>
            <th class="text-right">Volume</th>
            <th class="text-right">Price</th>
            <th>Trade</th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-neutral-800"></tbody>
      </table>
    </div>
  </div>

  <script>
    const COPY_ICON = `<svg class="copy-btn inline w-3.5 h-3.5 ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
    const CHECK_ICON = `<svg class="inline w-3.5 h-3.5 ml-1 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>`;

    const fmtUsd = (n) => {
      if (n == null || n === "" || Number.isNaN(Number(n))) return "—";
      const x = Number(n);
      if (Math.abs(x) >= 1e6) return "$" + (x / 1e6).toFixed(2) + "M";
      if (Math.abs(x) >= 1e3) return "$" + (x / 1e3).toFixed(1) + "k";
      if (Math.abs(x) >= 1) return "$" + x.toFixed(2);
      if (Math.abs(x) >= 0.01) return "$" + x.toFixed(4);
      return "$" + x.toFixed(6);
    };

    const fmtPrice = (n) => {
      if (n == null || Number.isNaN(Number(n))) return "—";
      const x = Number(n);
      if (x >= 1) return "$" + x.toFixed(4);
      if (x >= 0.0001) return "$" + x.toFixed(6);
      if (x >= 1e-8) return "$" + x.toFixed(10);
      return "$" + x.toFixed(12);
    };

    const fmtChange = (usd, pct) => {
      if (usd == null && pct == null) return "—";
      const v = usd ?? pct;
      const cls = v >= 0 ? "pos" : "neg";
      const sign = v >= 0 ? "+" : "";
      const u = usd != null ? sign + fmtUsd(Math.abs(usd)) : "";
      const p = pct != null ? ` (${sign}${Number(pct).toFixed(1)}%)` : "";
      return `<span class="${cls}">${u}${p}</span>`;
    };

    function tokenLogo(t) {
      if (t.image) {
        return `<img class="token-logo" src="${t.image}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><span class="token-logo-fallback" style="display:none">${t.emoji || (t.symbol || "?").charAt(0)}</span>`;
      }
      return `<span class="token-logo-fallback">${t.emoji || (t.symbol || "?").charAt(0)}</span>`;
    }

    function copyCA(addr, el) {
      navigator.clipboard.writeText(addr).then(() => {
        const prev = el.innerHTML;
        el.innerHTML = CHECK_ICON;
        setTimeout(() => { el.innerHTML = prev; }, 1200);
      });
    }
    window.copyCA = copyCA;

    async function load() {
      const res = await fetch("./data.json?t=" + Date.now());
      const data = await res.json();
      document.getElementById("updated").textContent =
        "updated " + new Date(data.updated).toLocaleString();

      document.getElementById("rows").innerHTML = data.tokens
        .map((t, i) => {
          const trade = t.token ? `https://pools.trade/t/${t.token}` : "#";
          return `<tr class="hover:bg-neutral-900/80">
            <td class="text-neutral-500">${i + 1}</td>
            <td>
              <div class="token-cell">
                ${tokenLogo(t)}
                <div class="min-w-0">
                  <div class="font-semibold text-white inline-flex items-center max-w-full">
                    <span class="truncate">${t.symbol || "???"}</span>
                    <span onclick="copyCA('${t.token}', this)" title="Copy CA">${COPY_ICON}</span>
                  </div>
                  <div class="text-xs text-neutral-500 truncate">${t.name || ""}</div>
                </div>
              </div>
            </td>
            <td class="text-right font-medium text-emerald-400">${fmtUsd(t.lp_value)}</td>
            <td class="text-right">${fmtChange(t.lp_change_24h, t.lp_change_24h_pct)}</td>
            <td class="text-right">${fmtChange(t.lp_change_7d, t.lp_change_7d_pct)}</td>
            <td class="text-right">${fmtChange(t.lp_change_30d, t.lp_change_30d_pct)}</td>
            <td class="text-right">${fmtUsd(t.fdv)}</td>
            <td class="text-right">${fmtUsd(t.volume_24h)}</td>
            <td class="text-right">${fmtPrice(t.price)}</td>
            <td><a class="text-emerald-400 hover:underline" href="${trade}" target="_blank" rel="noopener">Trade</a></td>
          </tr>`;
        })
        .join("");
    }
    load().catch((e) => {
      document.getElementById("updated").textContent = "error loading data";
      console.error(e);
    });
  </script>
</body>
</html>
