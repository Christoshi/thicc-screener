<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>THICC Screener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; margin: 0; }
    .pos { color: #4ade80; }
    .neg { color: #f87171; }
    table {
      table-layout: fixed;
      width: 100%;
      min-width: 900px;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0.55rem 0.6rem;
      vertical-align: middle;
      text-align: left;
    }
    .token-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .token-logo, .token-logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #262626;
      object-fit: cover;
    }
    .token-logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .copy-btn { opacity: 0.45; cursor: pointer; flex-shrink: 0; }
    .copy-btn:hover, .copy-btn:active { opacity: 1; }
    #search {
      background: #171717;
      border: 1px solid #333;
      color: #e5e5e5;
      border-radius: 9999px;
      padding: 0.5rem 0.9rem 0.5rem 2.1rem;
      font-size: 0.875rem;
      width: 100%;
      max-width: 280px;
      outline: none;
    }
    #search:focus { border-color: #34d399; }
    .search-wrap { position: relative; width: 100%; max-width: 280px; }
    .search-wrap svg {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: #737373;
      pointer-events: none;
    }
    .topnav {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex-wrap: wrap;
      padding: 0.55rem 0.75rem;
      background: #0d0d0d;
      border-bottom: 1px solid #1f1f1f;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topnav a {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      color: #d4d4d4;
      text-decoration: none;
      white-space: nowrap;
    }
    .topnav a:hover, .topnav a:active { background: #1a1a1a; color: #fff; }
    .topnav .brand {
      font-weight: 700;
      color: #34d399;
      font-size: 0.9rem;
      margin-right: 0.25rem;
    }
    .topnav .brand:hover { color: #6ee7b7; background: transparent; }
    .page-btn {
      background: #171717;
      border: 1px solid #333;
      color: #e5e5e5;
      border-radius: 0.5rem;
      padding: 0.5rem 1.1rem;
      font-size: 0.875rem;
      cursor: pointer;
      min-height: 44px;
    }
    .page-btn:hover:not(:disabled) { border-color: #34d399; color: #34d399; }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Mobile cards */
    .mobile-list { display: none; }
    .m-card {
      border: 1px solid #262626;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      background: #111;
    }
    .m-card + .m-card { margin-top: 0.6rem; }
    .m-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
    }
    .m-row + .m-row { margin-top: 0.35rem; }
    .m-label { color: #737373; }
    .m-trade {
      display: inline-block;
      margin-top: 0.65rem;
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      background: #064e3b;
      color: #6ee7b7;
      font-size: 0.8rem;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 767px) {
      .desktop-table { display: none !important; }
      .mobile-list { display: block; }
      #search, .search-wrap { max-width: none; }
      .topnav a { font-size: 0.75rem; padding: 0.35rem 0.5rem; }
      .token-logo, .token-logo-fallback { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="./">
      <img src="logo.png" alt="THICC" width="28" height="28" style="border-radius:6px" />
      ThiccScreener
    </a>
    <a href="https://pools.trade/t/0xE72936b1fE4cc0a521aE82bb9239F28f3FdB1C5D" target="_blank" rel="noopener">Buy THICC</a>
    <a href="https://dexscreener.com/robinhood/0xE72936b1fE4cc0a521aE82bb9239F28f3FdB1C5D" target="_blank" rel="noopener">Chart</a>
    <a href="https://t.me/THICCcommunity" target="_blank" rel="noopener">TG</a>
  </nav>

  <div class="max-w-[1400px] mx-auto px-3 py-4 sm:p-4 md:p-6">
    <div class="flex flex-col sm:flex-row sm:flex-wrap sm:items-end sm:justify-between gap-3 mb-5 sm:mb-8">
      <p class="text-sm text-neutral-400 leading-snug">
        Top tokens on
        <a href="https://pools.trade/" target="_blank" rel="noopener" class="text-emerald-400 hover:underline">Pools</a>
        by LP value
      </p>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input id="search" type="search" placeholder="Search token / CA" autocomplete="off" />
      </div>
    </div>

    <div class="desktop-table overflow-x-auto rounded-lg border border-neutral-800 -mx-0">
      <table class="text-sm">
        <colgroup>
          <col style="width:4%" />
          <col style="width:16%" />
          <col style="width:10%" />
          <col style="width:11%" />
          <col style="width:11%" />
          <col style="width:11%" />
          <col style="width:10%" />
          <col style="width:10%" />
          <col style="width:10%" />
          <col style="width:7%" />
        </colgroup>
        <thead class="bg-neutral-900 text-neutral-400 text-xs">
          <tr>
            <th>#</th>
            <th>Token</th>
            <th>LP Value</th>
            <th>24h</th>
            <th>7d</th>
            <th>30d</th>
            <th>Fdv</th>
            <th>Volume</th>
            <th>Price</th>
            <th>Trade</th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-neutral-800"></tbody>
      </table>
    </div>

    <div id="mobile-rows" class="mobile-list"></div>

    <div class="flex items-center justify-between mt-4 gap-3">
      <span id="page-info" class="text-sm text-neutral-500"></span>
      <div class="flex gap-2">
        <button id="prev" class="page-btn" type="button">Prev</button>
        <button id="next" class="page-btn" type="button">Next</button>
      </div>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 20;
    const COPY_ICON = `<svg class="copy-btn inline w-3.5 h-3.5 ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
    const CHECK_ICON = `<svg class="inline w-3.5 h-3.5 ml-1 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>`;

    let allTokens = [];
    let filtered = [];
    let page = 0;

    const fmtUsd = (n) => {
      if (n == null || n === "" || Number.isNaN(Number(n))) return "—";
      const x = Number(n);
      if (Math.abs(x) >= 1e6) return "$" + (x / 1e6).toFixed(2) + "M";
      if (Math.abs(x) >= 1e3) return "$" + (x / 1e3).toFixed(1) + "k";
      if (Math.abs(x) >= 1) return "$" + x.toFixed(2);
      if (Math.abs(x) >= 0.01) return "$" + x.toFixed(4);
      return "$" + x.toFixed(6);
    };

    const fmtPrice = (n) => {
      if (n == null || Number.isNaN(Number(n))) return "—";
      const x = Number(n);
      if (x >= 1) return "$" + x.toFixed(4);
      if (x >= 0.0001) return "$" + x.toFixed(6);
      if (x >= 1e-8) return "$" + x.toFixed(10);
      return "$" + x.toFixed(12);
    };

    const fmtChange = (usd, pct) => {
      if (usd == null && pct == null) return "—";
      const v = usd ?? pct;
      const cls = v >= 0 ? "pos" : "neg";
      const sign = v >= 0 ? "+" : "";
      const u = usd != null ? sign + fmtUsd(Math.abs(usd)) : "";
      const p = pct != null ? ` (${sign}${Number(pct).toFixed(1)}%)` : "";
      return `<span class="${cls}">${u}${p}</span>`;
    };

    function tokenLogo(t) {
      if (t.image) {
        return `<img class="token-logo" src="${t.image}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><span class="token-logo-fallback" style="display:none">${t.emoji || (t.symbol || "?").charAt(0)}</span>`;
      }
      return `<span class="token-logo-fallback">${t.emoji || (t.symbol || "?").charAt(0)}</span>`;
    }

    function copyCA(addr, el) {
      navigator.clipboard.writeText(addr).then(() => {
        const prev = el.innerHTML;
        el.innerHTML = CHECK_ICON;
        setTimeout(() => { el.innerHTML = prev; }, 1200);
      });
    }
    window.copyCA = copyCA;

    function totalPages() {
      return Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    }

    function render() {
      const start = page * PAGE_SIZE;
      const slice = filtered.slice(start, start + PAGE_SIZE);

      document.getElementById("rows").innerHTML = slice
        .map((t, i) => {
          const rank = start + i + 1;
          const trade = t.token ? `https://pools.trade/t/${t.token}` : "#";
          return `<tr class="hover:bg-neutral-900/80">
            <td class="text-neutral-500">${rank}</td>
            <td>
              <div class="token-cell">
                ${tokenLogo(t)}
                <div class="min-w-0">
                  <div class="font-semibold text-white inline-flex items-center max-w-full">
                    <span class="truncate">${t.symbol || "???"}</span>
                    <span onclick="copyCA('${t.token}', this)" title="Copy CA">${COPY_ICON}</span>
                  </div>
                  <div class="text-xs text-neutral-500 truncate">${t.name || ""}</div>
                </div>
              </div>
            </td>
            <td class="font-medium text-emerald-400">${fmtUsd(t.lp_value)}</td>
            <td>${fmtChange(t.lp_change_24h, t.lp_change_24h_pct)}</td>
            <td>${fmtChange(t.lp_change_7d, t.lp_change_7d_pct)}</td>
            <td>${fmtChange(t.lp_change_30d, t.lp_change_30d_pct)}</td>
            <td>${fmtUsd(t.fdv)}</td>
            <td>${fmtUsd(t.volume_24h)}</td>
            <td>${fmtPrice(t.price)}</td>
            <td><a class="text-emerald-400 hover:underline" href="${trade}" target="_blank" rel="noopener">Trade</a></td>
          </tr>`;
        })
        .join("");

      document.getElementById("mobile-rows").innerHTML = slice
        .map((t, i) => {
          const rank = start + i + 1;
          const trade = t.token ? `https://pools.trade/t/${t.token}` : "#";
          return `<div class="m-card">
            <div class="token-cell" style="margin-bottom:0.6rem">
              <span class="text-neutral-500 text-xs w-6 shrink-0">#${rank}</span>
              ${tokenLogo(t)}
              <div class="min-w-0 flex-1">
                <div class="font-semibold text-white inline-flex items-center">
                  <span class="truncate">${t.symbol || "???"}</span>
                  <span onclick="copyCA('${t.token}', this)" title="Copy CA">${COPY_ICON}</span>
                </div>
                <div class="text-xs text-neutral-500 truncate">${t.name || ""}</div>
              </div>
              <div class="text-emerald-400 font-semibold text-sm shrink-0">${fmtUsd(t.lp_value)}</div>
            </div>
            <div class="m-row"><span class="m-label">24h LP</span><span>${fmtChange(t.lp_change_24h, t.lp_change_24h_pct)}</span></div>
            <div class="m-row"><span class="m-label">FDV</span><span>${fmtUsd(t.fdv)}</span></div>
            <div class="m-row"><span class="m-label">Vol 24h</span><span>${fmtUsd(t.volume_24h)}</span></div>
            <div class="m-row"><span class="m-label">Price</span><span>${fmtPrice(t.price)}</span></div>
            <a class="m-trade" href="${trade}" target="_blank" rel="noopener">Trade on Pools →</a>
          </div>`;
        })
        .join("");

      const from = filtered.length ? start + 1 : 0;
      const to = Math.min(start + PAGE_SIZE, filtered.length);
      document.getElementById("page-info").textContent =
        filtered.length ? `${from}–${to} of ${filtered.length}` : "No results";

      document.getElementById("prev").disabled = page <= 0;
      document.getElementById("next").disabled = page >= totalPages() - 1;
    }

    function applySearch() {
      const q = (document.getElementById("search").value || "").trim().toLowerCase();
      if (!q) filtered = allTokens.slice();
      else {
        filtered = allTokens.filter((t) =>
          (t.symbol || "").toLowerCase().includes(q) ||
          (t.name || "").toLowerCase().includes(q) ||
          (t.token || "").toLowerCase().includes(q)
        );
      }
      page = 0;
      render();
    }

    async function load() {
      const res = await fetch("./data.json?t=" + Date.now());
      const data = await res.json();
      allTokens = data.tokens || [];
      filtered = allTokens.slice();
      page = 0;
      render();
    }

    document.getElementById("search").addEventListener("input", applySearch);
    document.getElementById("prev").addEventListener("click", () => {
      if (page > 0) { page--; render(); }
    });
    document.getElementById("next").addEventListener("click", () => {
      if (page < totalPages() - 1) { page++; render(); }
    });

    load().catch((e) => console.error(e));
  </script>
</body>
</html>
