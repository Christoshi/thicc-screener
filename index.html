<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THICC Screener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; }
    .pos { color: #4ade80; }
    .neg { color: #f87171; }
    table { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-[1400px] mx-auto">
    <h1 class="text-3xl font-bold text-emerald-400 mb-1">THICC Screener</h1>
    <p class="text-sm text-neutral-400 mb-6">
      pools.trade · ranked by LP Value ·
      <span id="updated">loading…</span>
    </p>

    <div class="overflow-x-auto rounded-lg border border-neutral-800">
      <table class="w-full text-sm text-left">
        <thead class="bg-neutral-900 text-neutral-400 uppercase text-xs">
          <tr>
            <th class="px-3 py-3">#</th>
            <th class="px-3 py-3">Token</th>
            <th class="px-3 py-3 text-right">LP Value</th>
            <th class="px-3 py-3 text-right">ETH side</th>
            <th class="px-3 py-3 text-right">Token side</th>
            <th class="px-3 py-3 text-right">All Fees Added</th>
            <th class="px-3 py-3 text-right">24h ETH Added</th>
            <th class="px-3 py-3 text-right">24h Tokens Added</th>
            <th class="px-3 py-3 text-right">FDV</th>
            <th class="px-3 py-3 text-right">Volume</th>
            <th class="px-3 py-3 text-right">Price</th>
            <th class="px-3 py-3">Trade</th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-neutral-800"></tbody>
      </table>
    </div>
  </div>

  <script>
    const fmtUsd = (n) => {
      if (n == null || n === "" || Number.isNaN(n)) return "—";
      const x = Number(n);
      if (x >= 1e6) return "$" + (x / 1e6).toFixed(2) + "M";
      if (x >= 1e3) return "$" + (x / 1e3).toFixed(1) + "k";
      if (x >= 1) return "$" + x.toFixed(2);
      if (x >= 0.0001) return "$" + x.toFixed(4);
      return "$" + x.toExponential(2);
    };
    const dash = (v) => (v == null || v === "" ? "—" : v);

    async function load() {
      const res = await fetch("/thicc-screener/data.json?t=" + Date.now());
      const data = await res.json();
      document.getElementById("updated").textContent =
        "updated " + new Date(data.updated).toLocaleString();

      const tbody = document.getElementById("rows");
      tbody.innerHTML = data.tokens
        .map((t, i) => {
          const short = t.token ? t.token.slice(0, 6) + "…" + t.token.slice(-4) : "";
          const trade = t.token
            ? `https://pools.trade/?token=${t.token}`
            : "#";
          return `<tr class="hover:bg-neutral-900/80">
            <td class="px-3 py-2 text-neutral-500">${i + 1}</td>
            <td class="px-3 py-2">
              <div class="font-semibold text-white">${t.symbol || "???"}</div>
              <div class="text-xs text-neutral-500">${t.name || ""} · ${short}</div>
            </td>
            <td class="px-3 py-2 text-right font-medium text-emerald-400">${fmtUsd(t.lp_value)}</td>
            <td class="px-3 py-2 text-right">${dash(t.eth_side != null ? fmtUsd(t.eth_side) : null)}</td>
            <td class="px-3 py-2 text-right">${dash(t.token_side != null ? fmtUsd(t.token_side) : null)}</td>
            <td class="px-3 py-2 text-right">${dash(t.all_fees_added)}</td>
            <td class="px-3 py-2 text-right">${dash(t.fees_24h_eth)}</td>
            <td class="px-3 py-2 text-right">${dash(t.fees_24h_tokens)}</td>
            <td class="px-3 py-2 text-right">${fmtUsd(t.fdv)}</td>
            <td class="px-3 py-2 text-right">${fmtUsd(t.volume_24h)}</td>
            <td class="px-3 py-2 text-right">${fmtUsd(t.price)}</td>
            <td class="px-3 py-2"><a class="text-emerald-400 hover:underline" href="${trade}" target="_blank" rel="noopener">Trade</a></td>
          </tr>`;
        })
        .join("");
    }
    load().catch((e) => {
      document.getElementById("updated").textContent = "error loading data";
      console.error(e);
    });
  </script>
</body>
</html>
