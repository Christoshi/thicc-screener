<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THICC Screener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; }
    .pos { color: #4ade80; }
    .neg { color: #f87171; }
    table { font-variant-numeric: tabular-nums; }
    .copy-btn {
      opacity: 0.45;
      transition: opacity 0.15s, color 0.15s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 4px;
    }
    .copy-btn:hover { opacity: 1; color: #fff; }
    .copy-btn.copied { opacity: 1; color: #4ade80; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-[1400px] mx-auto">
    <h1 class="text-3xl font-bold text-emerald-400 mb-1">THICC Screener</h1>
    <p class="text-sm text-neutral-400 mb-6">
      pools.trade · ranked by LP Value ·
      <span id="updated">loading…</span>
    </p>

    <div class="overflow-x-auto rounded-lg border border-neutral-800">
      <table class="w-full text-sm text-left">
        <thead class="bg-neutral-900 text-neutral-400 uppercase text-xs">
          <tr>
            <th class="px-3 py-3">#</th>
            <th class="px-3 py-3">Token</th>
            <th class="px-3 py-3 text-right">LP Value</th>
            <th class="px-3 py-3 text-right">24h LP</th>
            <th class="px-3 py-3 text-right">7d LP</th>
            <th class="px-3 py-3 text-right">30d LP</th>
            <th class="px-3 py-3 text-right">FDV</th>
            <th class="px-3 py-3 text-right">Volume</th>
            <th class="px-3 py-3 text-right">Price</th>
            <th class="px-3 py-3">Trade</th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-neutral-800"></tbody>
      </table>
    </div>
  </div>

  <script>
    const fmtUsd = (n) => {
      if (n == null || n === "" || Number.isNaN(n)) return "—";
      const x = Number(n);
      if (Math.abs(x) >= 1e6) return "$" + (x / 1e6).toFixed(2) + "M";
      if (Math.abs(x) >= 1e3) return "$" + (x / 1e3).toFixed(1) + "k";
      if (Math.abs(x) >= 1) return "$" + x.toFixed(2);
      if (Math.abs(x) >= 0.01) return "$" + x.toFixed(4);
      return "$" + x.toFixed(6);
    };

    const fmtPrice = (n) => {
      if (n == null || n === "" || Number.isNaN(n)) return "—";
      const x = Number(n);
      if (x === 0) return "$0";
      if (x >= 1) return "$" + x.toFixed(2);
      if (x >= 0.01) return "$" + x.toFixed(4);
      if (x >= 0.0001) return "$" + x.toFixed(6);
      if (x >= 0.000001) return "$" + x.toFixed(8);
      return "$" + x.toFixed(10).replace(/\.?0+$/, "");
    };

    const fmtChange = (usd, pct) => {
      if (usd == null && pct == null) return "—";
      const cls = (pct ?? usd) > 0 ? "pos" : (pct ?? usd) < 0 ? "neg" : "";
      const p = pct != null ? (pct > 0 ? "+" : "") + pct.toFixed(1) + "%" : "";
      const u = usd != null ? fmtUsd(usd) : "";
      return `<span class="${cls}">${u}${p ? " (" + p + ")" : ""}</span>`;
    };

    const COPY_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>`;

    const CHECK_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>`;

    function copyCA(addr, btn) {
      navigator.clipboard.writeText(addr).then(() => {
        btn.innerHTML = CHECK_ICON;
        btn.classList.add("copied");
        setTimeout(() => {
          btn.innerHTML = COPY_ICON;
          btn.classList.remove("copied");
        }, 1200);
      });
    }

    async function load() {
      const res = await fetch("/thicc-screener/data.json?t=" + Date.now());
      const data = await res.json();
      document.getElementById("updated").textContent =
        "updated " + new Date(data.updated).toLocaleString();

      const tbody = document.getElementById("rows");
      tbody.innerHTML = data.tokens
        .map((t, i) => {
          const trade = t.token ? `https://pools.trade/t/${t.token}` : "#";
          return `<tr class="hover:bg-neutral-900/80">
            <td class="px-3 py-2 text-neutral-500">${i + 1}</td>
            <td class="px-3 py-2">
              <div class="flex items-center gap-2">
                <div>
                  <div class="font-semibold text-white">${t.symbol || "???"}</div>
                  <div class="text-xs text-neutral-500">${t.name || ""}</div>
                </div>
                ${t.token ? `<button class="copy-btn text-neutral-400" onclick="copyCA('${t.token}', this)" title="Copy CA">${COPY_ICON}</button>` : ""}
              </div>
            </td>
            <td class="px-3 py-2 text-right font-medium text-emerald-400">${fmtUsd(t.lp_value)}</td>
            <td class="px-3 py-2 text-right">${fmtChange(t.lp_change_24h, t.lp_change_24h_pct)}</td>
            <td class="px-3 py-2 text-right">${fmtChange(t.lp_change_7d, t.lp_change_7d_pct)}</td>
            <td class="px-3 py-2 text-right">${fmtChange(t.lp_change_30d, t.lp_change_30d_pct)}</td>
            <td class="px-3 py-2 text-right">${fmtUsd(t.fdv)}</td>
            <td class="px-3 py-2 text-right">${fmtUsd(t.volume_24h)}</td>
            <td class="px-3 py-2 text-right">${fmtPrice(t.price)}</td>
            <td class="px-3 py-2"><a class="text-emerald-400 hover:underline" href="${trade}" target="_blank" rel="noopener">Trade</a></td>
          </tr>`;
        })
        .join("");
    }
    load().catch((e) => {
      document.getElementById("updated").textContent = "error loading data";
      console.error(e);
    });
  </script>
</body>
</html>
