<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>THICC Screener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; margin: 0; }
    .pos { color: #4ade80; }
    .neg { color: #f87171; }
    .muted { color: #737373; }
    table {
      table-layout: fixed;
      width: 100%;
      min-width: 1120px;
      font-variant-numeric: tabular-nums;
    }
    table.hide-7d { min-width: 1020px; }
    table.hide-30d { min-width: 1020px; }
    table.hide-7d.hide-30d { min-width: 920px; }
    table.hide-7d .col-7d,
    table.hide-30d .col-30d { display: none !important; }
    th, td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0.5rem 0.45rem;
      vertical-align: middle;
      text-align: left;
    }
    td.chg, th.chg { white-space: normal; }
    th.col-trade, td.col-trade {
      overflow: visible;
      text-overflow: clip;
      white-space: nowrap;
      min-width: 3.5rem;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: #e5e5e5; }
    th.sortable .sort-ind {
      display: inline-block;
      margin-left: 0.2rem;
      font-size: 0.65rem;
      color: #34d399;
      vertical-align: middle;
    }
    th.draggable { cursor: grab; }
    th.draggable:active { cursor: grabbing; }
    th.drag-over { outline: 1px dashed #34d399; outline-offset: -2px; }
    .chg-stack, .amt-stack {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      line-height: 1.25;
    }
    .chg-stack { font-size: 0.72rem; }
    .amt-stack { font-size: 0.8rem; }
    .amt-usd { font-size: 0.68rem; color: #737373; }
    .token-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .token-logo, .token-logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #262626;
      object-fit: cover;
    }
    .token-logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .copy-btn { opacity: 0.45; cursor: pointer; flex-shrink: 0; }
    .copy-btn:hover, .copy-btn:active { opacity: 1; }
    #search {
      background: #171717;
      border: 1px solid #333;
      color: #e5e5e5;
      border-radius: 9999px;
      padding: 0.5rem 0.9rem 0.5rem 2.1rem;
      font-size: 0.875rem;
      width: 100%;
      max-width: 280px;
      outline: none;
    }
    #search:focus { border-color: #34d399; }
    .search-wrap { position: relative; width: 100%; max-width: 280px; }
    .search-wrap svg {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: #737373;
      pointer-events: none;
    }
    .topnav {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex-wrap: wrap;
      padding: 0.55rem 0.75rem;
      background: #0d0d0d;
      border-bottom: 1px solid #1f1f1f;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topnav a {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      color: #d4d4d4;
      text-decoration: none;
      white-space: nowrap;
    }
    .topnav a:hover, .topnav a:active { background: #1a1a1a; color: #fff; }
    .topnav .brand {
      font-weight: 700;
      color: #34d399;
      font-size: 0.9rem;
      margin-right: 0.25rem;
    }
    .topnav .brand:hover { color: #6ee7b7; background: transparent; }
    .page-btn {
      background: #171717;
      border: 1px solid #333;
      color: #e5e5e5;
      border-radius: 0.5rem;
      padding: 0.5rem 1.1rem;
      font-size: 0.875rem;
      cursor: pointer;
      min-height: 44px;
    }
    .page-btn:hover:not(:disabled) { border-color: #34d399; color: #34d399; }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }
    @media (min-width: 900px) {
      .stats {
        grid-template-columns: 1.35fr 1fr 1fr 1fr;
        gap: 0.6rem;
      }
    }
    .stat-card {
      background: linear-gradient(165deg, #161a18 0%, #101210 55%, #0c0e0d 100%);
      border: 1px solid #2a3330;
      border-radius: 0.65rem;
      padding: 0.65rem 0.75rem;
      box-shadow: 0 1px 0 rgba(52, 211, 153, 0.06) inset, 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #8a9a92;
      letter-spacing: 0.02em;
      margin-bottom: 0.35rem;
    }
    .stat-value, .overview-row .v, .stat-grid .v {
      font-size: 0.9rem;
      font-weight: 600;
      color: #eef2f0;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.accent, .overview-row .v.accent { color: #34d399; }
    .stat-sub { font-size: 0.75rem; margin-top: 0.2rem; }
    .overview-row .k, .stat-grid .k { font-size: 0.75rem; color: #6b7a72; }
    .stat-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.2rem 0.6rem;
      align-items: baseline;
    }
    .stat-grid .v { text-align: right; }
    .overview-rows { display: flex; flex-direction: column; gap: 0.35rem; }
    .overview-row { display: flex; justify-content: space-between; gap: 0.5rem; }
    .desktop-table {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 0.5rem;
      border: 1px solid #262626;
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="./">
      <img src="logo.png" alt="THICC" width="28" height="28" style="border-radius:6px" />
      ThiccScreener
    </a>
    <a href="https://pools.trade/t/0xE72936b1fE4cc0a521aE82bb9239F28f3FdB1C5D" target="_blank" rel="noopener">Buy THICC</a>
    <a href="https://dexscreener.com/robinhood/0xE72936b1fE4cc0a521aE82bb9239F28f3FdB1C5D" target="_blank" rel="noopener">Chart</a>
    <a href="https://t.me/THICCcommunity" target="_blank" rel="noopener">Join TG</a>
  </nav>

  <div class="max-w-[1400px] mx-auto px-3 py-4 sm:p-4 md:p-6">
    <div class="flex flex-col sm:flex-row sm:flex-wrap sm:items-end sm:justify-between gap-3 mb-3">
      <p class="text-sm text-neutral-400 leading-snug">
        Top tokens on
        <a href="https://pools.trade/" target="_blank" rel="noopener" class="text-emerald-400 hover:underline">Pools</a>
        by LP value
      </p>
      <div class="flex items-center gap-2 flex-wrap">
        <button type="button" class="page-btn" id="reset-cols" title="Reset column order">Reset columns</button>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
          </svg>
          <input id="search" type="search" placeholder="Search token / CA" autocomplete="off" />
        </div>
      </div>
    </div>

    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-label">Overview</div>
        <div class="overview-rows">
          <div class="overview-row">
            <span class="k">Total LP</span>
            <span class="v accent" id="stat-lp">—</span>
          </div>
          <div class="overview-row">
            <span class="k">24h Volume</span>
            <span class="v" id="stat-vol">—</span>
          </div>
          <div class="overview-row">
            <span class="k">Pools Tracked</span>
            <span class="v" id="stat-pools">—</span>
          </div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total ETH in Pools</div>
        <div class="stat-value" id="stat-eth">—</div>
        <div class="stat-sub" id="stat-eth-chg"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Instant launches</div>
        <div class="stat-grid" id="stat-instant">
          <span class="k">24h</span><span class="v">—</span>
          <span class="k">7d</span><span class="v">—</span>
          <span class="k">30d</span><span class="v">—</span>
          <span class="k">All</span><span class="v">—</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Crowd launches</div>
        <div class="stat-grid" id="stat-crowd">
          <span class="k">24h</span><span class="v">—</span>
          <span class="k">7d</span><span class="v">—</span>
          <span class="k">30d</span><span class="v">—</span>
          <span class="k">All</span><span class="v">—</span>
        </div>
      </div>
    </div>

    <div class="desktop-table">
      <table class="text-sm" id="token-table">
        <colgroup id="colgroup"></colgroup>
        <thead class="bg-neutral-900 text-neutral-400 text-xs uppercase">
          <tr id="thead-row"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="flex items-center justify-between gap-3 mt-4 flex-wrap">
      <span id="page-info" class="text-sm text-neutral-400"></span>
      <div class="flex gap-2">
        <button class="page-btn" id="prev-btn" disabled>Prev</button>
        <button class="page-btn" id="next-btn" disabled>Next</button>
      </div>
    </div>
  </div>

  <script>
    const PER_PAGE = 20;
    const COL_ORDER_KEY = 'thicc-col-order';
    const COPY_ICON = `<svg class="copy-btn inline w-3.5 h-3.5 ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
    const CHECK_ICON = `<svg class="inline w-3.5 h-3.5 ml-1 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>`;

    const COL_DEFS = {
      rank:   { id: 'rank',   label: '#',       width: '3%',  fixed: true,  sortable: false, hideClass: null },
      symbol: { id: 'symbol', label: 'Token',   width: '14%', fixed: false, sortable: true,  sortKey: 'symbol', hideClass: null },
      lp:     { id: 'lp',     label: 'LP Value',width: '9%',  fixed: false, sortable: true,  sortKey: 'lp_value', hideClass: null },
      eth:    { id: 'eth',    label: 'ETH',     width: '8%',  fixed: false, sortable: true,  sortKey: 'eth_side', hideClass: null },
      tok:    { id: 'tok',    label: 'Token',   width: '9%',  fixed: false, sortable: true,  sortKey: 'token_side', hideClass: null },
      chg24:  { id: 'chg24',  label: '24h',     width: '9%',  fixed: false, sortable: true,  sortKey: 'chg_24h', hideClass: null, chg: true },
      chg7:   { id: 'chg7',   label: '7d',      width: '9%',  fixed: false, sortable: true,  sortKey: 'chg_7d', hideClass: 'col-7d', chg: true },
      chg30:  { id: 'chg30',  label: '30d',     width: '9%',  fixed: false, sortable: true,  sortKey: 'chg_30d', hideClass: 'col-30d', chg: true },
      fdv:    { id: 'fdv',    label: 'Fdv',     width: '8%',  fixed: false, sortable: true,  sortKey: 'fdv', hideClass: null },
      fdvlp:  { id: 'fdvlp',  label: 'FDV/LP',  width: '7%',  fixed: false, sortable: true,  sortKey: 'fdv_lp', hideClass: null },
      vol:    { id: 'vol',    label: 'Volume',  width: '8%',  fixed: false, sortable: true,  sortKey: 'volume_24h', hideClass: null },
      price:  { id: 'price',  label: 'Price',   width: '8%',  fixed: false, sortable: true,  sortKey: 'price', hideClass: null },
      trade:  { id: 'trade',  label: 'Trade',   width: '5%',  fixed: true,  sortable: false, hideClass: null, trade: true }
    };

    const DEFAULT_ORDER = ['rank','symbol','lp','eth','tok','chg24','chg7','chg30','fdv','fdvlp','vol','price','trade'];

    let allTokens = [];
    let filtered = [];
    let page = 0;
    let has7d = false;
    let has30d = false;
    let sortKey = 'lp_value';
    let sortDir = 'desc';
    let colOrder = loadColOrder();
    let dragSrcId = null;

    const $ = (id) => document.getElementById(id);

    function loadColOrder() {
      try {
        const raw = localStorage.getItem(COL_ORDER_KEY);
        if (!raw) return DEFAULT_ORDER.slice();
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return DEFAULT_ORDER.slice();
        const known = new Set(DEFAULT_ORDER);
        const cleaned = arr.filter(id => known.has(id));
        DEFAULT_ORDER.forEach(id => { if (!cleaned.includes(id)) cleaned.push(id); });
        // enforce fixed ends
        const mid = cleaned.filter(id => id !== 'rank' && id !== 'trade');
        return ['rank', ...mid, 'trade'];
      } catch {
        return DEFAULT_ORDER.slice();
      }
    }

    function saveColOrder() {
      try { localStorage.setItem(COL_ORDER_KEY, JSON.stringify(colOrder)); } catch (_) {}
    }

    function resetColOrder() {
      colOrder = DEFAULT_ORDER.slice();
      try { localStorage.removeItem(COL_ORDER_KEY); } catch (_) {}
      buildHeader();
      renderTable();
    }

    function fmtUsd(n) {
      if (n == null || !Number.isFinite(n)) return '—';
      if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
      if (Math.abs(n) >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'k';
      return '$' + n.toFixed(2);
    }
    function fmtNum(n, d = 2) {
      if (n == null || !Number.isFinite(n)) return '—';
      if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1) + 'k';
      return n.toFixed(d);
    }
    function fmtPct(n) {
      if (n == null || !Number.isFinite(n)) return '<span class="muted">—</span>';
      const cls = n > 0 ? 'pos' : n < 0 ? 'neg' : 'muted';
      const sign = n > 0 ? '+' : '';
      return `<span class="${cls}">${sign}${n.toFixed(2)}%</span>`;
    }
    function fmtChg(pctEth, pctTok) {
      return `<div class="chg-stack"><div>ETH ${fmtPct(pctEth)}</div><div>Tok ${fmtPct(pctTok)}</div></div>`;
    }
    function fmtAmt(side, usd) {
      return `<div class="amt-stack"><div>${fmtNum(side, 4)}</div><div class="amt-usd">${fmtUsd(usd)}</div></div>`;
    }
    function fdvLpRatio(t) {
      const fdv = t.fdv, lp = t.lp_value;
      if (fdv == null || lp == null || !Number.isFinite(fdv) || !Number.isFinite(lp) || lp <= 0) return null;
      return fdv / lp;
    }
    function fmtFdvLp(t) {
      const r = fdvLpRatio(t);
      if (r == null) return '—';
      if (r >= 100) return r.toFixed(0) + 'x';
      if (r >= 10) return r.toFixed(1) + 'x';
      return r.toFixed(2) + 'x';
    }

    function copyCA(addr, el) {
      navigator.clipboard.writeText(addr).then(() => {
        const prev = el.innerHTML;
        el.innerHTML = CHECK_ICON;
        setTimeout(() => { el.innerHTML = prev; }, 1200);
      });
    }
    window.copyCA = copyCA;

    function numOrNull(v) {
      return v != null && Number.isFinite(Number(v)) ? Number(v) : null;
    }

    function getSortValue(t, key) {
      switch (key) {
        case 'symbol': return (t.symbol || '').toLowerCase();
        case 'lp_value': return numOrNull(t.lp_value);
        case 'eth_side': return numOrNull(t.eth_side);
        case 'token_side': return numOrNull(t.token_side);
        case 'fdv': return numOrNull(t.fdv);
        case 'fdv_lp': return fdvLpRatio(t);
        case 'volume_24h': return numOrNull(t.volume_24h);
        case 'price': return numOrNull(t.price);
        case 'chg_24h': return numOrNull(t.eth_change_24h_pct);
        case 'chg_7d': return numOrNull(t.eth_change_7d_pct);
        case 'chg_30d': return numOrNull(t.eth_change_30d_pct);
        default: return null;
      }
    }
    function getSortTie(t, key) {
      if (key === 'chg_24h') return numOrNull(t.token_change_24h_pct);
      if (key === 'chg_7d') return numOrNull(t.token_change_7d_pct);
      if (key === 'chg_30d') return numOrNull(t.token_change_30d_pct);
      return null;
    }

    function cmpNullLast(a, b, dir) {
      const aN = a == null || (typeof a === 'number' && !Number.isFinite(a));
      const bN = b == null || (typeof b === 'number' && !Number.isFinite(b));
      if (aN && bN) return 0;
      if (aN) return 1;
      if (bN) return -1;
      if (typeof a === 'string' && typeof b === 'string') {
        const c = a.localeCompare(b);
        return dir === 'asc' ? c : -c;
      }
      const d = a - b;
      return dir === 'asc' ? d : -d;
    }

    function sortTokens(list) {
      return list.slice().sort((a, b) => {
        let c = cmpNullLast(getSortValue(a, sortKey), getSortValue(b, sortKey), sortDir);
        if (c !== 0) return c;
        c = cmpNullLast(getSortTie(a, sortKey), getSortTie(b, sortKey), sortDir);
        if (c !== 0) return c;
        return (b.lp_value || 0) - (a.lp_value || 0);
      });
    }

    function cellHtml(colId, t, rank) {
      switch (colId) {
        case 'rank': return `<td class="muted">${rank}</td>`;
        case 'symbol': {
          const logo = t.image
            ? `<img class="token-logo" src="${t.image}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="token-logo-fallback" style="display:none">${t.emoji || (t.symbol || '?')[0]}</div>`
            : `<div class="token-logo-fallback">${t.emoji || (t.symbol || '?')[0]}</div>`;
          const ca = (t.token || '').replace(/'/g, "\\'");
          return `<td><div class="token-cell">${logo}<div style="min-width:0"><div class="font-medium truncate inline-flex items-center max-w-full"><span class="truncate">${t.symbol || '—'}</span><span onclick="copyCA('${ca}', this)" title="Copy CA">${COPY_ICON}</span></div><div class="text-xs muted truncate">${t.name || ''}</div></div></div></td>`;
        }
        case 'lp': return `<td>${fmtUsd(t.lp_value)}</td>`;
        case 'eth': return `<td>${fmtAmt(t.eth_side, t.eth_side_usd)}</td>`;
        case 'tok': return `<td>${fmtAmt(t.token_side, t.token_side_usd)}</td>`;
        case 'chg24': return `<td class="chg">${fmtChg(t.eth_change_24h_pct, t.token_change_24h_pct)}</td>`;
        case 'chg7': return `<td class="chg col-7d">${fmtChg(t.eth_change_7d_pct, t.token_change_7d_pct)}</td>`;
        case 'chg30': return `<td class="chg col-30d">${fmtChg(t.eth_change_30d_pct, t.token_change_30d_pct)}</td>`;
        case 'fdv': return `<td>${fmtUsd(t.fdv)}</td>`;
        case 'fdvlp': return `<td>${fmtFdvLp(t)}</td>`;
        case 'vol': return `<td>${fmtUsd(t.volume_24h)}</td>`;
        case 'price': return `<td>${t.price != null && Number.isFinite(t.price) ? '$' + Number(t.price).toPrecision(4) : '—'}</td>`;
        case 'trade': return `<td class="col-trade"><a href="https://pools.trade/t/${t.token}" target="_blank" rel="noopener" class="text-emerald-400 hover:underline text-xs">Trade</a></td>`;
        default: return `<td>—</td>`;
      }
    }

    function buildHeader() {
      const cg = $('colgroup');
      const tr = $('thead-row');
      cg.innerHTML = '';
      tr.innerHTML = '';
      colOrder.forEach(id => {
        const def = COL_DEFS[id];
        if (!def) return;
        const col = document.createElement('col');
        col.style.width = def.width;
        if (def.hideClass) col.className = def.hideClass;
        if (def.trade) col.style.minWidth = '3.5rem';
        cg.appendChild(col);

        const th = document.createElement('th');
        th.textContent = def.label;
        th.dataset.colId = id;
        if (def.chg) th.classList.add('chg');
        if (def.hideClass) th.classList.add(def.hideClass);
        if (def.trade) th.classList.add('col-trade');
        if (def.sortable) {
          th.classList.add('sortable');
          th.dataset.sort = def.sortKey;
          th.addEventListener('click', (e) => {
            if (e.target.closest('[draggable]')) return;
            onSortClick(def.sortKey);
          });
        }
        if (!def.fixed) {
          th.classList.add('draggable');
          th.draggable = true;
          th.addEventListener('dragstart', onDragStart);
          th.addEventListener('dragover', onDragOver);
          th.addEventListener('dragleave', onDragLeave);
          th.addEventListener('drop', onDrop);
          th.addEventListener('dragend', onDragEnd);
        }
        tr.appendChild(th);
      });
      updateSortHeaders();
    }

    function onDragStart(e) {
      dragSrcId = e.currentTarget.dataset.colId;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragSrcId); } catch (_) {}
    }
    function onDragOver(e) {
      e.preventDefault();
      const th = e.currentTarget;
      if (th.dataset.colId === 'rank' || th.dataset.colId === 'trade') return;
      th.classList.add('drag-over');
    }
    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }
    function onDrop(e) {
      e.preventDefault();
      const target = e.currentTarget;
      target.classList.remove('drag-over');
      const toId = target.dataset.colId;
      if (!dragSrcId || dragSrcId === toId || toId === 'rank' || toId === 'trade') return;
      const from = colOrder.indexOf(dragSrcId);
      const to = colOrder.indexOf(toId);
      if (from < 0 || to < 0) return;
      colOrder.splice(from, 1);
      colOrder.splice(to, 0, dragSrcId);
      // keep rank first, trade last
      colOrder = colOrder.filter(id => id !== 'rank' && id !== 'trade');
      colOrder = ['rank', ...colOrder, 'trade'];
      saveColOrder();
      buildHeader();
      renderTable();
    }
    function onDragEnd() {
      dragSrcId = null;
      document.querySelectorAll('th.drag-over').forEach(el => el.classList.remove('drag-over'));
    }

    function updateSortHeaders() {
      document.querySelectorAll('th.sortable').forEach(th => {
        const ind = th.querySelector('.sort-ind');
        if (ind) ind.remove();
        if (th.dataset.sort === sortKey) {
          const span = document.createElement('span');
          span.className = 'sort-ind';
          span.textContent = sortDir === 'desc' ? '▼' : '▲';
          th.appendChild(span);
        }
      });
    }

    function onSortClick(key) {
      if (sortKey === key) {
        if (sortDir === 'desc') sortDir = 'asc';
        else { sortKey = 'lp_value'; sortDir = 'desc'; }
      } else {
        sortKey = key;
        sortDir = 'desc';
      }
      page = 0;
      applyFilter(false);
    }

    function renderStats(s) {
      $('stat-lp').textContent = fmtUsd(s.total_lp_usd);
      $('stat-vol').textContent = fmtUsd(s.total_volume_24h);
      $('stat-pools').textContent = s.pools ?? '—';
      $('stat-eth').textContent = fmtNum(s.total_eth_side, 2) + ' ETH';
      const chg = s.total_eth_change_24h_pct;
      $('stat-eth-chg').innerHTML = Number.isFinite(chg)
        ? `<span class="${chg >= 0 ? 'pos' : 'neg'}">${chg > 0 ? '+' : ''}${chg.toFixed(2)}% 24h</span>`
        : '';
      const setGrid = (id, obj) => {
        const el = $(id);
        if (!obj) return;
        el.innerHTML = `
          <span class="k">24h</span><span class="v">${obj.h24 ?? '—'}</span>
          <span class="k">7d</span><span class="v">${obj.d7 ?? '—'}</span>
          <span class="k">30d</span><span class="v">${obj.d30 ?? '—'}</span>
          <span class="k">All</span><span class="v">${obj.all ?? '—'}</span>`;
      };
      setGrid('stat-instant', s.instant_launches);
      setGrid('stat-crowd', s.crowd_launches);
    }

    function renderTable() {
      const start = page * PER_PAGE;
      const slice = filtered.slice(start, start + PER_PAGE);
      const tbody = $('tbody');
      tbody.innerHTML = slice.map((t, i) => {
        const rank = start + i + 1;
        return `<tr class="border-t border-neutral-800 hover:bg-neutral-900/50">${colOrder.map(id => cellHtml(id, t, rank)).join('')}</tr>`;
      }).join('');

      const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
      $('page-info').textContent = filtered.length
        ? `Page ${page + 1} of ${totalPages} · ${filtered.length} tokens`
        : 'No tokens';
      $('prev-btn').disabled = page <= 0;
      $('next-btn').disabled = page >= totalPages - 1;
      updateSortHeaders();
    }

    function applyFilter(resetPage = true) {
      const q = ($('search').value || '').trim().toLowerCase();
      let list = !q
        ? allTokens.slice()
        : allTokens.filter(t =>
            (t.symbol || '').toLowerCase().includes(q) ||
            (t.name || '').toLowerCase().includes(q) ||
            (t.token || '').toLowerCase().includes(q)
          );
      filtered = sortTokens(list);
      if (resetPage) page = 0;
      renderTable();
    }

    $('reset-cols').onclick = resetColOrder;
    $('search').addEventListener('input', () => applyFilter(true));
    $('prev-btn').onclick = () => { if (page > 0) { page--; renderTable(); } };
    $('next-btn').onclick = () => {
      if ((page + 1) * PER_PAGE < filtered.length) { page++; renderTable(); }
    };

    buildHeader();

    fetch('data.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        allTokens = (data.tokens || []).slice();
        has7d = allTokens.some(t => Number.isFinite(t.eth_change_7d_pct) || Number.isFinite(t.token_change_7d_pct));
        has30d = allTokens.some(t => Number.isFinite(t.eth_change_30d_pct) || Number.isFinite(t.token_change_30d_pct));
        const table = $('token-table');
        table.classList.toggle('hide-7d', !has7d);
        table.classList.toggle('hide-30d', !has30d);
        renderStats(data.stats || {});
        applyFilter(true);
      })
      .catch(err => {
        console.error(err);
        $('tbody').innerHTML = '<tr><td colspan="13" class="text-center py-8 muted">Failed to load data.json</td></tr>';
      });
  </script>
</body>
</html>
